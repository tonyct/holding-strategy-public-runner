name: Public gateway offline contract tests

on:
  push:
    branches: [main]
    paths:
      - 'ops/public_data_gateway.py'
      - 'ops/public_gateway_extended.py'
      - 'ops/public_gateway_quotes.py'
      - 'ops/public_gateway_extended.py'
      - 'tests/test_public_data_gateway.py'
      - 'tests/test_public_us_daily_quotes.py'
      - 'tests/test_public_gateway_extended.py'
      - 'tests/test_public_gateway_quotes.py'
      - 'tests/test_public_gateway_extended.py'
      - '.github/workflows/public_gateway_tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run gateway offline tests
        run: python -m pip install requests && python -m unittest discover -s tests -p 'test_public*gateway*.py' -v && python -m unittest tests.test_public_us_daily_quotes -v
