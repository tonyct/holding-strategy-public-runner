name: PUBLIC data gateway via public request commits
on:
  push:
    branches: [main]
    paths:
      - 'requests/public_gateway/*.json'
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Determine exact public request changed by this commit
        shell: bash
        run: |
          set -euo pipefail
          # Refuse mixed change sets and more than one request per commit.
          git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" > /tmp/files.txt
          python - <<'PY'
          import re
          from pathlib import Path
          files=Path('/tmp/files.txt').read_text().splitlines()
          if len(files)!=1 or not re.fullmatch(r'requests/public_gateway/[A-Za-z0-9_-]{8,80}\.json',files[0]):
              raise ValueError('INVALID_PUBLIC_GATEWAY_COMMIT_SCOPE')
          from ops.public_data_gateway import validate
          import json
          request=json.loads(Path(files[0]).read_text())
          validate(request)
          if Path(files[0]).stem!=request['request_id']:
              raise ValueError('REQUEST_ID_FILE_MISMATCH')
          Path('/tmp/selected_gateway_request.txt').write_text(files[0])
          PY
      - name: Install approved public adapter
        run: python -m pip install baostock
      - name: Execute request and publish run-scoped receipt
        run: |
          python -m ops.public_data_gateway \
            --request "$(cat /tmp/selected_gateway_request.txt)" \
            --output .gateway/result
      - name: Upload evidence even for provider GAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-gateway-push-${{ github.run_id }}-${{ github.run_attempt }}
          path: .gateway/result/
          if-no-files-found: warn
          retention-days: 30
