name: Community discovery acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'trigger-community-acceptance.txt'

permissions:
  contents: write

concurrency:
  group: community-discovery-acceptance
  cancel-in-progress: true

jobs:
  community:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal dependencies
        run: python -m pip install requests
      - name: Test source-board provenance gates
        run: python -m unittest tests.test_community_direct -v
      - name: Run community collector
        run: |
          rm -rf output/community
          mkdir -p output/community
          python engine/collect_community_direct.py --output output/community --limit 20 --delay 0.6
      - name: Evaluate community quality
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("output/community/COMMUNITY_DIRECT_DISCOVERY.json").read_text())
          q=json.loads(Path("output/community/COMMUNITY_QUALIFIED_QUEUE.json").read_text())
          checks=s.get("checks") or []
          found=[r for r in checks if r.get("status")=="DIRECT_POSTS_FOUND"]
          restricted=[r for r in checks if r.get("status") in ("ACCESS_RESTRICTED","REQUEST_FAILED","PARSE_FAILED","HTTP_ERROR")]
          leads=s.get("lead_count") or 0
          complete=(s.get("symbols_checked")==11 and len(checks)==11)
          a_symbols={"600941.SH","001286.SZ","603993.SH","600499.SH","600795.SH","603871.SH","601857.SH"}
          hk_symbols={"148.HK","2233.HK","3933.HK","9926.HK"}
          a_found={r.get("symbol") for r in found if r.get("symbol") in a_symbols}
          hk_found={r.get("symbol") for r in found if r.get("symbol") in hk_symbols}
          rows=s.get("rows") or []
          hk_code_ok=all(str(r.get("market_code") or "").startswith("hk") and len(str(r.get("market_code") or ""))==7
                         for r in rows if r.get("symbol") in hk_symbols)
          a_code_ok=all(not str(r.get("market_code") or "").startswith("hk")
                        for r in rows if r.get("symbol") in a_symbols)
          qualified_symbols=set(q.get("symbols_with_qualified_leads") or [])
          qualified_count=int(q.get("qualified_count") or 0)
          target_specific_count=int(q.get("target_specific_qualified_count") or 0)
          source_board_mismatch_count=int(q.get("source_board_mismatch_count") or 0)
          qualified_coverage=(len(qualified_symbols)==11 and q.get("target_specific_coverage_ok") is True)
          target_rows=[r for r in q.get("rows",[]) if r.get("qualified_for_target_specific_shadow_verification")]
          target_rows_integrity=(all(
              ((r.get("discovery_relation")=="DIRECT_BOARD" and
                r.get("target_board_match") is True and
                r.get("source_board_code")==r.get("market_code") and
                r.get("target_name_mentioned") is False) or
               (r.get("discovery_relation")=="TITLE_ENTITY_MENTION" and
                r.get("target_board_match") is False and
                r.get("target_name_mentioned") is True)) and
              r.get("post_content_status")=="TITLE_ONLY_BODY_NOT_FETCHED" and
              r.get("raw_post_verified") is False and
              isinstance(r.get("url"),str) and r.get("post_id") in r.get("url") and
              r.get("source_board_code") in r.get("url")
              for r in target_rows) and len(target_rows)==target_specific_count)
          board_metadata_complete=all(
              r.get("discovery_relation") in ("DIRECT_BOARD","TITLE_ENTITY_MENTION","CROSS_BOARD","BOARD_UNKNOWN") and
              isinstance(r.get("post_content_status"),str) and
              r.get("raw_post_verified") is False and
              (bool(r.get("source_board_code") and
                    isinstance(r.get("url"),str) and
                    r.get("source_board_code") in r.get("url") and
                    r.get("post_id") in r.get("url")) or
               (r.get("discovery_relation")=="BOARD_UNKNOWN" and r.get("url") is None))
              for r in rows
          )
          useful=(leads>0 and len(a_found)==7 and len(hk_found)==4 and hk_code_ok and a_code_ok and board_metadata_complete and qualified_count>0 and target_specific_count>0 and qualified_coverage and target_rows_integrity)
          out={
            "schema":"E36_COMMUNITY_ACCEPTANCE/v6",
            "source":"EASTMONEY_GUBA_DIRECT",
            "checks_complete":complete,
            "symbols_checked":s.get("symbols_checked"),
            "a_share_symbols_with_posts":sorted(a_found),
            "hk_symbols_with_posts":sorted(hk_found),
            "a_share_coverage_ok":len(a_found)==7,
            "hk_coverage_ok":len(hk_found)==4,
            "market_code_mapping_ok":hk_code_ok and a_code_ok,
            "source_board_metadata_complete":board_metadata_complete,
            "accepted_count":leads,
            "qualified_count":qualified_count,
            "target_specific_qualified_count":target_specific_count,
            "source_board_mismatch_count":source_board_mismatch_count,
            "title_entity_mention_count":int(q.get("title_entity_mention_count") or 0),
            "qualified_symbols":sorted(qualified_symbols),
            "qualified_coverage_ok":qualified_coverage,
            "target_rows_integrity_ok":target_rows_integrity,
            "restricted_or_failed_symbols":[r.get("symbol") for r in restricted],
            "research_only":s.get("research_only"),
            "live_platform_coverage":s.get("live_platform_coverage"),
            "useful_leads_present":useful,
            "status":"PASS" if complete and useful else "FAIL"
          }
          Path("output/community/COMMUNITY_ACCEPTANCE.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(out,ensure_ascii=False))
          if out["status"]!="PASS":
            raise SystemExit("COMMUNITY_ACCEPTANCE_FAIL")
          PY
      - name: Persist acceptance output
        if: always()
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          if compgen -G "output/community/*.json" > /dev/null; then
            rm -rf runtime/acceptance/community/latest
            mkdir -p runtime/acceptance/community/latest
            cp -f output/community/*.json runtime/acceptance/community/latest/
          else
            echo "NO_COMMUNITY_OUTPUT_PRESERVE_PREVIOUS_ACCEPTANCE"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/acceptance/community/latest
          if ! git diff --cached --quiet; then
            git commit -m "Persist community acceptance $GITHUB_RUN_ID"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: community-acceptance-${{ github.run_id }}
          path: output/community/
          retention-days: 7
