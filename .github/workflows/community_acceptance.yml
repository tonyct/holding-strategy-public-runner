name: Community discovery acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'trigger-community-acceptance.txt'

permissions:
  contents: write

concurrency:
  group: community-discovery-acceptance
  cancel-in-progress: true

jobs:
  community:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal dependencies
        run: python -m pip install requests
      - name: Run community collector
        run: |
          rm -rf output/community
          mkdir -p output/community
          python engine/collect_community_direct.py --output output/community --limit 20 --delay 0.6
      - name: Evaluate community quality
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("output/community/COMMUNITY_DIRECT_DISCOVERY.json").read_text())
          checks=s.get("checks") or []
          found=[r for r in checks if r.get("status")=="DIRECT_POSTS_FOUND"]
          restricted=[r for r in checks if r.get("status") in ("ACCESS_RESTRICTED","REQUEST_FAILED","PARSE_FAILED","HTTP_ERROR")]
          leads=s.get("lead_count") or 0
          complete=(s.get("symbols_checked")==11 and len(checks)==11)
          breadth=(s.get("symbols_with_posts") or 0)
          useful=(leads>0 and breadth>0)
          out={
            "schema":"E36_COMMUNITY_ACCEPTANCE/v2",
            "source":"EASTMONEY_GUBA_DIRECT",
            "checks_complete":complete,
            "symbols_checked":s.get("symbols_checked"),
            "symbols_with_posts":breadth,
            "accepted_count":leads,
            "restricted_or_failed_symbols":[r.get("symbol") for r in restricted],
            "research_only":s.get("research_only"),
            "live_platform_coverage":s.get("live_platform_coverage"),
            "useful_leads_present":useful,
            "status":"PASS" if complete and useful else "FAIL"
          }
          Path("output/community/COMMUNITY_ACCEPTANCE.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(out,ensure_ascii=False))
          if out["status"]!="PASS":
            raise SystemExit("COMMUNITY_ACCEPTANCE_FAIL")
          PY
      - name: Persist acceptance output
        if: always()
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          if compgen -G "output/community/*.json" > /dev/null; then
            rm -rf runtime/acceptance/community/latest
            mkdir -p runtime/acceptance/community/latest
            cp -f output/community/*.json runtime/acceptance/community/latest/
          else
            echo "NO_COMMUNITY_OUTPUT_PRESERVE_PREVIOUS_ACCEPTANCE"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/acceptance/community/latest
          if ! git diff --cached --quiet; then
            git commit -m "Persist community acceptance $GITHUB_RUN_ID"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: community-acceptance-${{ github.run_id }}
          path: output/community/
          retention-days: 7
