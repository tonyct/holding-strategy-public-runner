name: Community discovery acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'trigger-community-acceptance.txt'

permissions:
  contents: write

concurrency:
  group: community-discovery-acceptance
  cancel-in-progress: true

jobs:
  community:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal dependencies
        run: python -m pip install requests
      - name: Run community collector
        run: |
          rm -rf output/community
          mkdir -p output/community
          python engine/collect_community_public_index.py --output output/community --per-query 5 --delay 0.6
      - name: Evaluate community quality
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("output/community/PUBLIC_INDEX_SCAN_RECEIPT.json").read_text())
          q=json.loads(Path("output/community/COMMUNITY_RESEARCH_QUEUE.json").read_text())
          rows=s.get("rows") or []
          raw=sum(int(r.get("raw_items") or 0) for r in rows)
          wrong=sum(int(r.get("filtered_wrong_host") or 0) for r in rows)
          accepted=sum(int(r.get("accepted_before_dedup") or 0) for r in rows)
          source_counts=s.get("source_counts") or {}
          complete=(s.get("checks_completed")==s.get("checks_expected")==44)
          resolver_ok=not (raw>0 and accepted==0 and wrong>=raw)
          useful=q.get("accepted_count",0)>0
          out={
            "schema":"E36_COMMUNITY_ACCEPTANCE/v1",
            "checks_complete":complete,
            "raw_items":raw,
            "wrong_host_filtered":wrong,
            "accepted_before_dedup":accepted,
            "accepted_count":q.get("accepted_count",0),
            "source_counts":source_counts,
            "resolver_ok":resolver_ok,
            "useful_leads_present":useful,
            "live_platform_coverage":q.get("live_platform_coverage"),
            "research_only":q.get("research_only"),
            "status":"PASS" if complete and resolver_ok and useful else "FAIL"
          }
          Path("output/community/COMMUNITY_ACCEPTANCE.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(out,ensure_ascii=False))
          if out["status"]!="PASS":
            raise SystemExit("COMMUNITY_ACCEPTANCE_FAIL")
          PY
      - name: Persist acceptance output
        if: always()
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          rm -rf runtime/acceptance/community/latest
          mkdir -p runtime/acceptance/community/latest
          cp -f output/community/*.json runtime/acceptance/community/latest/ || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/acceptance/community/latest
          if ! git diff --cached --quiet; then
            git commit -m "Persist community acceptance $GITHUB_RUN_ID"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: community-acceptance-${{ github.run_id }}
          path: output/community/
          retention-days: 7
