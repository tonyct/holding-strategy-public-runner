name: Public company research acquisition

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Public-only refresh reason'
        required: false
        type: string
      request_id:
        description: 'Opaque idempotency token; never a raw private cycle id'
        required: false
        type: string
  schedule:
    # Public-only freshness backstop. Hourly acquisition keeps the normal
    # bundle comfortably inside the Private 3h freshness SLA even when the
    # optional cross-repo immediate-dispatch credential is unavailable.
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'trigger-public-run.txt'

permissions:
  contents: write

concurrency:
  group: public-research-latest
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate public data-only contract
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          contract=json.loads(Path("config/public_data_contract.json").read_text())
          universe=json.loads(Path("config/research_universe.json").read_text())
          assert contract.get("schema")=="PUBLIC_DATA_ACQUISITION_CONTRACT/v1"
          assert contract.get("role")=="PUBLIC_MARKET_DATA_EVIDENCE_AND_DETERMINISTIC_COMPUTE_ONLY"
          assert contract.get("deterministic_public_compute_only") is True
          assert contract.get("no_valuation_logic") is True
          assert contract.get("no_recommendation_logic") is True
          assert contract.get("no_private_repo_dependency") is True
          assert contract.get("no_investment_decision_logic") is True
          assert contract.get("no_trade_logic") is True
          assert universe.get("schema")=="E36_PUBLIC_RESEARCH_UNIVERSE/v1"
          assert universe.get("source")=="PUBLIC_RESEARCH_COVERAGE_UNIVERSE_NOT_ACCOUNT_HOLDINGS"
          assert universe.get("strategy_id")=="PUBLIC_COMPANY_RESEARCH"
          allowed_top={"schema","source","strategy_id","universe_version","disclaimer","stocks"}
          unexpected=set(universe)-allowed_top
          assert not unexpected, f"unexpected universe keys: {sorted(unexpected)}"
          stocks=universe.get("stocks")
          assert isinstance(stocks,list) and stocks
          for row in stocks:
              assert isinstance(row,dict)
              extra=set(row)-{"symbol","active"}
              assert not extra, f"forbidden stock fields for {row.get('symbol')}: {sorted(extra)}"
              assert isinstance(row.get("symbol"),str) and row["symbol"]
              assert isinstance(row.get("active"),bool)
          print("PUBLIC_DATA_CONTRACT_PASS")
          PY

      - name: Install dependencies
        run: python -m pip install -r engine/requirements.txt pymupdf pdfplumber akshare baostock

      - name: Collect public financials
        continue-on-error: true
        run: |
          mkdir -p output/a_financials
          python engine/run_financials.py --period auto --output output/a_financials

      - name: Collect public announcements
        continue-on-error: true
        run: |
          mkdir -p output/a
          python engine/collect_announcements.py --output output/a --start "$(date -u -d '75 days ago' +%Y%m%d)" --end "$(date -u +%Y%m%d)"

      - name: Collect public HK financials
        continue-on-error: true
        run: |
          mkdir -p output/hk_financials
          python engine/collect_hk_financials.py --period auto --output output/hk_financials

      - name: Collect public community discovery
        continue-on-error: true
        run: |
          mkdir -p output/community
          python engine/collect_community_direct.py --output output/community --limit 20 --delay 0.6

      - name: Collect public news discovery
        continue-on-error: true
        run: |
          mkdir -p output/news
          python engine/collect_news_public_index.py --output output/news --per-query 8 --delay 0.6

      - name: Extract investor-relations discovery
        continue-on-error: true
        run: |
          mkdir -p output/ir
          python engine/collect_ir_discovery.py --input-dir output/a --output output/ir/IR_DISCOVERY.json

      - name: Collect AKShare public discovery
        continue-on-error: true
        run: |
          mkdir -p output/discovery
          python engine/collect_akshare_discovery.py --output output/discovery/AKSHARE_DISCOVERY.json --limit 20

      - name: Collect public quotes
        continue-on-error: true
        run: |
          mkdir -p output/quotes
          python -m engine.collect_quotes --output output/quotes/QUOTE_RECEIPT.json --delay 0.6

      - name: Fetch rolling-window A-share official originals
        continue-on-error: true
        run: |
          mkdir -p output/originals/a
          python -m ops.public_a_originals             --index-dir output/a             --output output/originals/a             --universe config/research_universe.json             --max-per-symbol 100

      - name: Fetch rolling-window HKEX official originals
        continue-on-error: true
        run: |
          mkdir -p output/originals/hk
          python -m ops.public_hk_originals             --output output/originals/hk             --universe config/research_universe.json             --issuer-map config/hkex_issuer_ids.json             --start "$(date -u -d '75 days ago' +%Y%m%d)" --end "$(date -u +%Y%m%d)"             --max-per-symbol 100

      - name: Recover and cache exact historic issuer TTM originals (Public only)
        continue-on-error: true
        timeout-minutes: 18
        run: |
          mkdir -p output/originals/ttm
          python -m ops.public_historical_ttm_originals \
            --config config/public_historical_original_backfill_20261008.json \
            --output output/originals/ttm \
            --cache-dir runtime/latest/originals/ttm

      - name: Update durable public lead lifecycle
        run: |
          mkdir -p output/state
          if test -f runtime/latest/state/PUBLIC_LEAD_LIFECYCLE_REGISTRY.json; then
            cp runtime/latest/state/PUBLIC_LEAD_LIFECYCLE_REGISTRY.json output/state/PUBLIC_LEAD_LIFECYCLE_REGISTRY.json
          fi
          python -m ops.public_lead_registry             --registry output/state/PUBLIC_LEAD_LIFECYCLE_REGISTRY.json             --run-id "$GITHUB_RUN_ID"             --community output/community/COMMUNITY_DIRECT_DISCOVERY.json             --news output/news/NEWS_DISCOVERY.json             --ir output/ir/IR_DISCOVERY.json             --akshare output/discovery/AKSHARE_DISCOVERY.json             --output output/state/PUBLIC_LEAD_LIFECYCLE_REGISTRY.json

      - name: Resolve deterministic public lead lifecycle
        run: |
          python -m ops.public_lead_resolver \
            --registry output/state/PUBLIC_LEAD_LIFECYCLE_REGISTRY.json \
            --a-originals output/originals/a/A_ORIGINALS_RECEIPT.json \
            --hk-originals output/originals/hk/HK_ORIGINALS_RECEIPT.json \
            --report output/state/PUBLIC_LEAD_RESOLUTION_REPORT.json

      - name: Extract source-bound public original text candidates
        run: |
          mkdir -p output/compute
          python -m ops.public_original_text             --root output/originals             --output output/compute/PUBLIC_ORIGINAL_TEXT_CANDIDATES.json

      - name: Build acquisition health receipt
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          universe=json.loads(Path("config/research_universe.json").read_text())
          active=[x["symbol"] for x in universe["stocks"] if x.get("active")]
          assert active and len(active)==len(set(active)),"INVALID_ACTIVE_UNIVERSE"
          a_scope={x for x in active if not x.endswith(".HK")}
          hk_scope=set(active)-a_scope
          n=len(active)
          hard_failures=[]
          degraded_reasons=[]
          checks={}

          def load(path, required=True):
              p=Path(path)
              if not p.is_file():
                  if required:
                      hard_failures.append("MISSING:"+path)
                  return {}
              try:
                  return json.loads(p.read_text())
              except Exception as e:
                  if required:
                      hard_failures.append("INVALID_JSON:"+path+":"+type(e).__name__)
                  return {}

          fin=load("output/a_financials/ACQUISITION_RECEIPT.json")
          fin_ok=(fin.get("status")=="CORE_FIELDS_FETCHED_UNVERIFIED"
                  and fin.get("core_three_statement_count")==fin.get("ticker_count")
                  and fin.get("runner_exit_code")==0)
          checks["a_share_financials"]={"ok":fin_ok,"status":fin.get("status"),
              "core_three_statement_count":fin.get("core_three_statement_count"),
              "ticker_count":fin.get("ticker_count"),"runner_exit_code":fin.get("runner_exit_code")}
          if not fin_ok: degraded_reasons.append("A_SHARE_FINANCIALS_INCOMPLETE")

          ann=load("output/a/ANNOUNCEMENT_RECEIPT.json")
          allowed_ann={"LINKS_FETCHED_UNVERIFIED_ORIGIN","NO_NEW_PUBLICATION_IN_WINDOW_HISTORY_VERIFIED"}
          ann_rows=ann.get("rows") or []
          bad_ann=[r.get("symbol") for r in ann_rows if r.get("status") not in allowed_ann]
          ann_ok=(len(ann_rows)==len(a_scope) and {r.get("symbol") for r in ann_rows}==a_scope and not bad_ann)
          checks["a_share_announcements"]={"ok":ann_ok,"row_count":len(ann_rows),"bad_symbols":bad_ann}
          if not ann_ok: degraded_reasons.append("A_SHARE_ANNOUNCEMENTS_INCOMPLETE")

          hk=load("output/hk_financials/HK_FINANCIAL_RECEIPT.json")
          hk_rows=hk.get("rows") or []
          hk_ok=(len(hk_rows)==len(hk_scope) and {r.get("symbol") for r in hk_rows}==hk_scope and all(r.get("status")=="RAW_THREE_STATEMENTS_FETCHED_UNVERIFIED" for r in hk_rows))
          checks["hk_financials"]={"ok":hk_ok,"row_count":len(hk_rows)}
          if not hk_ok: degraded_reasons.append("HK_FINANCIALS_INCOMPLETE")

          community=load("output/community/COMMUNITY_DIRECT_DISCOVERY.json")
          community_rows=community.get("rows") or []
          community_checks=community.get("checks") or []
          community_ok=(community.get("source")=="EASTMONEY_GUBA_DIRECT"
                        and community.get("symbols_checked")==n
                        and community.get("symbols_with_posts")==n
                        and len(community_rows)>0
                        and len(community_checks)==n)
          mapping_ok=True
          for r in community_rows:
              symbol=str(r.get("symbol") or "")
              market_code=str(r.get("market_code") or "")
              if symbol.endswith(".HK"):
                  expected="hk"+symbol.split(".")[0].zfill(5)
              else:
                  expected=symbol.split(".")[0]
              if market_code!=expected:
                  mapping_ok=False
                  break
          community_ok=community_ok and mapping_ok
          qualified=sum(1 for r in community_rows if r.get("qualified_for_shadow_verification"))
          checks["community_discovery"]={"ok":community_ok,
              "source":community.get("source"),
              "symbols_checked":community.get("symbols_checked"),
              "symbols_with_posts":community.get("symbols_with_posts"),
              "lead_count":community.get("lead_count"),
              "qualified_for_shadow_verification":qualified,
              "market_code_mapping_ok":mapping_ok}
          if not community_ok: degraded_reasons.append("COMMUNITY_DISCOVERY_INCOMPLETE")

          news=load("output/news/NEWS_DISCOVERY.json")
          news_ok=(news.get("schema")=="E36_PUBLIC_NEWS_DISCOVERY/v1" and isinstance(news.get("rows"),list))
          checks["news_discovery"]={"ok":news_ok,"lead_count":news.get("lead_count")}
          if not news_ok: degraded_reasons.append("NEWS_DISCOVERY_INVALID")

          ir=load("output/ir/IR_DISCOVERY.json")
          ir_ok=(ir.get("schema")=="E36_PUBLIC_IR_DISCOVERY/v1" and isinstance(ir.get("rows"),list))
          checks["ir_discovery"]={"ok":ir_ok,"lead_count":ir.get("lead_count")}
          if not ir_ok: degraded_reasons.append("IR_DISCOVERY_INVALID")

          ak=load("output/discovery/AKSHARE_DISCOVERY.json", required=False)
          ak_ok=(ak.get("schema")=="E36_AKSHARE_PUBLIC_DISCOVERY/v1" and isinstance(ak.get("rows"),list))
          checks["akshare_discovery"]={"ok":ak_ok,"news_symbol_count":ak.get("news_symbol_count"),
              "news_row_count":ak.get("news_row_count"),"community_row_count":ak.get("community_row_count")}
          if not ak_ok: degraded_reasons.append("AKSHARE_DISCOVERY_UNAVAILABLE")

          a_orig=load("output/originals/a/A_ORIGINALS_RECEIPT.json", required=False)
          hk_orig=load("output/originals/hk/HK_ORIGINALS_RECEIPT.json", required=False)
          a_fetched=sum(int(x.get("fetched",0)) for x in (a_orig.get("symbols") or {}).values())
          hk_fetched=sum(int(x.get("fetched",0)) for x in (hk_orig.get("symbols") or {}).values())
          checks["dynamic_official_originals"]={
              "a_share_fetched":a_fetched,
              "hk_fetched":hk_fetched,
              "a_share_complete_symbols":sum(x.get("complete") is True for x in (a_orig.get("symbols") or {}).values()),
              "hk_complete_symbols":sum(x.get("complete") is True for x in (hk_orig.get("symbols") or {}).values())}
          if a_fetched==0: degraded_reasons.append("A_SHARE_OFFICIAL_ORIGINALS_UNAVAILABLE")
          if hk_fetched==0: degraded_reasons.append("HK_OFFICIAL_ORIGINALS_UNAVAILABLE")

          lead_state=load("output/state/PUBLIC_LEAD_LIFECYCLE_REGISTRY.json", required=False)
          lead_resolution=load("output/state/PUBLIC_LEAD_RESOLUTION_REPORT.json", required=False)
          checks["lead_lifecycle"]={
              "total":(lead_state.get("counts") or {}).get("total"),
              "pending":(lead_state.get("counts") or {}).get("pending"),
              "terminal":(lead_state.get("counts") or {}).get("terminal"),
              "transition_count":lead_resolution.get("transition_count"),
              "automatic_fact_promotion":lead_resolution.get("automatic_fact_promotion")}
          if lead_resolution.get("automatic_fact_promotion") is not False:
              hard_failures.append("LEAD_RESOLUTION_FACT_PROMOTION_CONTRACT_BROKEN")

          quotes=load("output/quotes/QUOTE_RECEIPT.json")
          quote_ok=(quotes.get("quotes_with_source_session")==n)
          checks["quotes"]={"ok":quote_ok,"quotes_with_source_session":quotes.get("quotes_with_source_session")}
          if not quote_ok: degraded_reasons.append("QUOTE_COVERAGE_INCOMPLETE")

          status="HARD_FAIL" if hard_failures else ("DEGRADED" if degraded_reasons else "PASS")
          out={"schema":"E36_PUBLIC_ACQUISITION_HEALTH/v2",
               "status":status,
               "hard_failures":hard_failures,
               "degraded_reasons":degraded_reasons,
               "semantics":"SOURCE_GAPS_DEGRADE_BUT_DO_NOT_INVALIDATE_AN_INTEGRITY_SAFE_BUNDLE",
               "checks":checks}
          Path("output/ACQUISITION_HEALTH.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          print(json.dumps(out,ensure_ascii=False))
          PY

      - name: Build conservative public financial table candidates v2
        shell: bash
        continue-on-error: true
        timeout-minutes: 5
        run: |
          timeout 240s python -m ops.public_fact_pipeline_v2 --root output/originals --out-dir output/compute --previous runtime/latest/compute/PUBLIC_FACT_STORE_V2.json

      - name: Build per-symbol financial fact quality receipt v2
        shell: bash
        continue-on-error: true
        timeout-minutes: 2
        run: |
          test -s output/compute/PUBLIC_FACT_STORE_V2.json
          test -s output/compute/PUBLIC_TABLE_CANDIDATES_V2.json
          python -m ops.public_fact_quality_v2 \
            --universe config/research_universe.json \
            --store output/compute/PUBLIC_FACT_STORE_V2.json \
            --candidates output/compute/PUBLIC_TABLE_CANDIDATES_V2.json \
            --output output/compute/PUBLIC_FACT_QUALITY_V2.json

      - name: Normalize explicit A/H API financial source candidates
        shell: bash
        continue-on-error: true
        timeout-minutes: 2
        run: |
          python -m ops.public_api_snapshot_adapter \
            --a-financials output/a_financials \
            --hk-financials output/hk_financials \
            --output output/compute/PUBLIC_API_STANDARDIZED_CANDIDATES_V1.json

      - name: Build unified API-first candidate and AI gap packet
        shell: bash
        continue-on-error: true
        timeout-minutes: 2
        run: |
          test -s output/compute/PUBLIC_FACT_STORE_V2.json
          python -m ops.public_fact_routing_bridge \
            --universe config/research_universe.json \
            --fact-store output/compute/PUBLIC_FACT_STORE_V2.json \
            --api-records output/compute/PUBLIC_API_STANDARDIZED_CANDIDATES_V1.json \
            --output output/compute/PUBLIC_API_FIRST_ROUTING_V1.json

      - name: Build deterministic public metrics
        shell: bash
        run: |
          python -m engine.public_metrics \
            --root output --universe config/research_universe.json \
            --output output/PUBLIC_DETERMINISTIC_METRICS.json

      - name: Build public company research packets
        shell: bash
        run: |
          python -m ops.public_company_compute             --universe config/research_universe.json             --metrics output/PUBLIC_DETERMINISTIC_METRICS.json             --a-originals output/originals/a/A_ORIGINALS_RECEIPT.json             --hk-originals output/originals/hk/HK_ORIGINALS_RECEIPT.json             --text-candidates output/compute/PUBLIC_ORIGINAL_TEXT_CANDIDATES.json             --lead-registry output/state/PUBLIC_LEAD_LIFECYCLE_REGISTRY.json             --run-id "$GITHUB_RUN_ID"             --output output/compute/PUBLIC_COMPANY_RESEARCH_COMPUTE.json

      - name: Update content-addressed public evidence registry
        shell: bash
        run: |
          mkdir -p output/state output/evidence/raw/sha256
          if test -f runtime/latest/state/PUBLIC_DYNAMIC_EVIDENCE_REGISTRY.json; then
            cp runtime/latest/state/PUBLIC_DYNAMIC_EVIDENCE_REGISTRY.json output/state/PUBLIC_DYNAMIC_EVIDENCE_REGISTRY.json
          fi
          python -m ops.public_evidence_registry             --registry output/state/PUBLIC_DYNAMIC_EVIDENCE_REGISTRY.json             --source-root output             --store-root output/evidence/raw/sha256             --run-id "$GITHUB_RUN_ID"             --output output/state/PUBLIC_EVIDENCE_REGISTRY_UPDATE.json

      - name: Build dynamic public evidence index
        shell: bash
        run: |
          python -m engine.public_evidence_index \
            --root output --output output/PUBLIC_EVIDENCE_INDEX.json

      - name: Freeze exact public run snapshot
        shell: bash
        run: |
          python -m engine.public_run_snapshot \
            --universe config/research_universe.json \
            --health output/ACQUISITION_HEALTH.json \
            --evidence-index output/PUBLIC_EVIDENCE_INDEX.json \
            --metrics output/PUBLIC_DETERMINISTIC_METRICS.json \
            --output output/PUBLIC_RUN_SNAPSHOT.json

      - name: Build public-safe manifest
        shell: bash
        env:
          DISPATCH_REASON: ${{ inputs.reason }}
          DISPATCH_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path
          root=Path("output")
          root.mkdir(exist_ok=True)
          files=[]
          for p in sorted(root.rglob("*")):
              if p.is_file():
                  b=p.read_bytes()
                  files.append({"path":str(p.relative_to(root)),"sha256":hashlib.sha256(b).hexdigest(),"size":len(b)})
          request_id=(os.environ.get("DISPATCH_REQUEST_ID") or "").strip()
          reason=(os.environ.get("DISPATCH_REASON") or "").strip()
          if os.environ.get("GITHUB_EVENT_NAME")=="push":
              try:
                  request=json.loads(Path("trigger-public-run.txt").read_text(encoding="utf-8"))
                  if request.get("schema")=="PUBLIC_REFRESH_REQUEST/v1":
                      request_id=str(request.get("request_id") or "").strip()
                      reason=str(request.get("reason") or "").strip()
              except (OSError, ValueError, TypeError):
                  pass
          refresh_request=None
          if request_id:
              refresh_request={
                  "schema":"PUBLIC_REFRESH_REQUEST/v1",
                  "request_id":request_id,
                  "reason":reason or "PUBLIC_REFRESH",
                  "privacy_class":"PUBLIC_REFRESH_CONTROL_ONLY",
              }
          def sha(path):
              b=Path(path).read_bytes()
              return hashlib.sha256(b).hexdigest()
          snapshot=json.loads(Path("output/PUBLIC_RUN_SNAPSHOT.json").read_text())
          out={
              "schema":"E36_PUBLIC_RESEARCH_BUNDLE/v1",
              "privacy_class":"PUBLIC_MARKET_DATA_ONLY",
              "source_repository":os.environ.get("GITHUB_REPOSITORY"),
              "source_run_id":os.environ.get("GITHUB_RUN_ID"),
              "source_run_attempt":os.environ.get("GITHUB_RUN_ATTEMPT"),
              "source_commit_sha":os.environ.get("GITHUB_SHA"),
              "completed_at_utc":datetime.now(timezone.utc).isoformat(),
              "contains_account_state":False,
              "contains_portfolio_decision":False,
              "public_compute":{
                  "snapshot_path":"PUBLIC_RUN_SNAPSHOT.json",
                  "snapshot_sha256":sha("output/PUBLIC_RUN_SNAPSHOT.json"),
                  "evidence_index_path":"PUBLIC_EVIDENCE_INDEX.json",
                  "evidence_index_sha256":sha("output/PUBLIC_EVIDENCE_INDEX.json"),
                  "metrics_path":"PUBLIC_DETERMINISTIC_METRICS.json",
                  "metrics_sha256":sha("output/PUBLIC_DETERMINISTIC_METRICS.json"),
                  "company_research_path":"compute/PUBLIC_COMPANY_RESEARCH_COMPUTE.json",
                  "company_research_sha256":sha("output/compute/PUBLIC_COMPANY_RESEARCH_COMPUTE.json"),
                  "lead_registry_path":"state/PUBLIC_LEAD_LIFECYCLE_REGISTRY.json",
                  "lead_registry_sha256":sha("output/state/PUBLIC_LEAD_LIFECYCLE_REGISTRY.json"),
                  "lead_resolution_path":"state/PUBLIC_LEAD_RESOLUTION_REPORT.json",
                  "lead_resolution_sha256":sha("output/state/PUBLIC_LEAD_RESOLUTION_REPORT.json"),
                  "dynamic_evidence_registry_path":"state/PUBLIC_DYNAMIC_EVIDENCE_REGISTRY.json",
                  "dynamic_evidence_registry_sha256":sha("output/state/PUBLIC_DYNAMIC_EVIDENCE_REGISTRY.json"),
                  "active_symbol_count":snapshot.get("active_symbol_count"),
                  "no_private_repo_dependency":True,
                  "no_valuation":True,
                  "no_trade_logic":True,
              },
              "refresh_request":refresh_request,
              "files":files,
          }
          Path("output/PUBLIC_RESEARCH_BUNDLE.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n")
          PY

      - name: Public-safety gate
        shell: bash
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          prohibited = re.compile(r'\\bactual_held\\b|\\baccount_state\\b|\\bportfolio_decision\\b|\\btracking_only\\b|\\bposition_size\\b|\\bcost_basis\\b|\\bcash_nav\\b|\\bdrive_bootstrap_id\\b|\\buser_screenshot\\b|XUEQIU_COOKIE|HOLDING_STRATEGY|"active_version"\\s*:|"epoch"\\s*:|"private_(?:commit|generation)"\\s*:|"raw_shadow_cycle_id"\\s*:', re.I)
          root=Path("output")
          failures=[]
          for p in root.rglob("*"):
              if not p.is_file() or p.name=="PUBLIC_RESEARCH_BUNDLE.json":
                  continue
              try:
                  text=p.read_text(errors="ignore")
              except Exception:
                  continue
              if prohibited.search(text):
                  failures.append(str(p))
          manifest=json.loads(Path("output/PUBLIC_RESEARCH_BUNDLE.json").read_text())
          assert manifest.get("contains_account_state") is False
          assert manifest.get("contains_portfolio_decision") is False
          compute=manifest.get("public_compute") or {}
          assert compute.get("no_private_repo_dependency") is True
          assert compute.get("no_valuation") is True
          assert compute.get("no_trade_logic") is True
          assert compute.get("snapshot_sha256") and compute.get("metrics_sha256") and compute.get("evidence_index_sha256")
          assert compute.get("company_research_sha256") and compute.get("lead_registry_sha256")
          assert compute.get("lead_resolution_sha256")
          assert compute.get("dynamic_evidence_registry_sha256")
          if failures:
              raise SystemExit("Private/account semantic detected in public output: "+", ".join(failures))
          print("PUBLIC_OUTPUT_PRIVACY_PASS")
          PY

      - name: Enforce acquisition health
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          h=json.loads(Path("output/ACQUISITION_HEALTH.json").read_text())
          if h.get("status")=="HARD_FAIL" or h.get("hard_failures"):
              raise SystemExit("PUBLIC_ACQUISITION_HARD_FAIL: "+",".join(h.get("hard_failures") or []))
          print("PUBLIC_ACQUISITION_HEALTH_"+str(h.get("status") or "UNKNOWN"))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-research-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          retention-days: 7


      # Public must never receive or use credentials that can write to Private.
      # Trusted SHADOW sync reads the published Public bundle separately.

      - name: Persist latest public JSON bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            echo "PERSIST_ATTEMPT=$attempt"
            git fetch origin main
            remote_run="$(git show origin/main:runtime/latest/PUBLIC_RESEARCH_BUNDLE.json 2>/dev/null | python -c 'import json,sys; print(json.load(sys.stdin).get("source_run_id","0"))' 2>/dev/null || echo 0)"
            if [[ "$remote_run" =~ ^[0-9]+$ ]] && (( remote_run > GITHUB_RUN_ID )); then
              echo "SKIP_STALE_PERSIST current=$GITHUB_RUN_ID remote=$remote_run"
              exit 0
            fi
            git reset --hard origin/main
            rm -rf runtime/latest
            mkdir -p runtime/latest
            find output -type f -name '*.json' -print0 | while IFS= read -r -d '' src; do
              rel="${src#output/}"
              mkdir -p "runtime/latest/$(dirname "$rel")"
              cp "$src" "runtime/latest/$rel"
            done
            git add runtime/latest
            if git diff --cached --quiet; then
              echo "NO_RUNTIME_CHANGE"
              exit 0
            fi
            git commit -m "Publish public research bundle $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT"
            if git push origin HEAD:main; then
              echo "PERSIST_SUCCESS attempt=$attempt"
              exit 0
            fi
            echo "PERSIST_CONFLICT attempt=$attempt"
            sleep $((attempt * 2))
          done
          echo "PERSIST_RETRY_EXHAUSTED"
          exit 1

