name: Public on-demand data gateway
run-name: gateway-${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Opaque public request id used for exact run correlation'
        required: true
        type: string
      request_json:
        description: 'Public-only bounded request JSON; no private research or account data'
        required: true
        type: string

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Write and validate request
        env:
          PUBLIC_GATEWAY_REQUEST: ${{ inputs.request_json }}
          PUBLIC_GATEWAY_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          mkdir -p .gateway/request
          python - <<'PY'
          import json, os
          from pathlib import Path
          from ops.public_data_gateway import validate
          request=json.loads(os.environ["PUBLIC_GATEWAY_REQUEST"])
          validate(request)
          if request['request_id'] != os.environ['PUBLIC_GATEWAY_REQUEST_ID']:
              raise ValueError('DISPATCH_REQUEST_ID_MISMATCH')
          Path(".gateway/request/request.json").write_text(json.dumps(request))
          print("PUBLIC_REQUEST_ACCEPTED")
          PY
      - name: Install approved public source adapter
        shell: bash
        run: |
          set -euo pipefail
          TYPE=$(python -c 'import json;print(json.load(open(".gateway/request/request.json")).get("data_type",""))')
          if [ "$TYPE" = "historical_quotes" ]; then
            MARKET=$(python -c 'import json;print(json.load(open(".gateway/request/request.json")).get("symbol","").rsplit(".",1)[-1])')
            if [ "$MARKET" = "US" ]; then
              python -m pip install requests
            else
              python -m pip install baostock
              python -m pip install akshare || echo "AKSHARE_OPTIONAL_FALLBACK_DEP_UNAVAILABLE"
            fi
          elif [ "$TYPE" = "sec_companyfacts" ]; then
            python -m pip install requests
          elif [ "$TYPE" = "financial_statements" ]; then
            python -m pip install -r engine/requirements.txt akshare
          elif [ "$TYPE" = "announcement_index" ] || [ "$TYPE" = "official_filings" ]; then
            python -m pip install requests
          elif [ -z "$TYPE" ]; then
            echo "DISCOVER_ONLY"
          else
            exit 2
          fi
      - name: Execute public request and retain evidence
        run: |
          python -m ops.public_data_gateway --request .gateway/request/request.json --output .gateway/result
      - name: Upload bounded immutable run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-gateway-${{ github.run_id }}-${{ github.run_attempt }}
          path: .gateway/result/
          if-no-files-found: warn
          retention-days: 30
